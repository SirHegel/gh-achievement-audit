name: Bug report
description: Report an incorrect observation, incomplete source, or command failure.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for making the audit more reliable. Remove tokens, private repository details, and personal data before submitting.

  - type: input
    id: version
    attributes:
      label: Version
      description: Paste the release tag or commit reported by the extension.
      placeholder: v0.1.0
    validations:
      required: true

  - type: input
    id: subject
    attributes:
      label: Public account audited
      placeholder: octocat
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python version, GitHub CLI version, and exit code.
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include the minimal redacted output needed to reproduce the problem.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected observation and public evidence
      description: Link the public profile, event, or official documentation supporting the expectation.
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: Safety checks
      options:
        - label: I removed tokens, private repository names, and personal data.
          required: true
        - label: I reproduced this with the latest release or explained why I could not.
          required: true
